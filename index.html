<style>
:root{
  --bg:#f5f7fa; --card:#ffffff; --text:#1f2937; --muted:#6b7280;
  --accent:#1a73e8; --border:#e5e7eb; --badge:#eef2ff; --badge-text:#4338ca;
  --tagbg:#f3f4f6; --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1115; --card:#181b21; --text:#e5e7eb; --muted:#9ca3af;
         --border:#272b33; --badge:#1e2333; --badge-text:#a5b4fc;
         --tagbg:#232830; --shadow:0 1px 3px rgba(0,0,0,.5); }
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--text); line-height:1.7;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB",
              "Microsoft YaHei",sans-serif;
  padding:0 0 48px; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header{
  background:linear-gradient(135deg,var(--accent) 0%,#6366f1 100%);
  color:#fff;padding:34px 0 28px;margin-bottom:22px;
}
header .wrap{display:flex;flex-direction:column;gap:6px}
.brand{font-size:13px;letter-spacing:.14em;opacity:.9;text-transform:uppercase}
h1{font-size:26px;font-weight:700;letter-spacing:-.01em}
.sub{font-size:14px;opacity:.92}
.meta-bar{
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  font-size:13px;color:var(--muted);margin-bottom:18px
}
.pill{background:var(--tagbg);border-radius:999px;padding:4px 11px;font-size:12px}
.pill.warn{background:#fef3c7;color:#92400e}
@media (prefers-color-scheme: dark){ .pill.warn{background:#3b2f10;color:#fcd34d} }
.list{display:flex;flex-direction:column;gap:12px}
.card{
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:16px 18px;box-shadow:var(--shadow);transition:transform .12s ease,border-color .12s ease;
}
.card:hover{transform:translateY(-1px);border-color:var(--accent)}
.card-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.rank{
  flex:0 0 auto;width:24px;height:24px;border-radius:7px;background:var(--accent);color:#fff;
  font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;
  margin-top:2px
}
.title{font-size:16.5px;font-weight:600;line-height:1.5;flex:1}
.title a{color:inherit;text-decoration:none}
.title a:hover{color:var(--accent);text-decoration:underline}
.summary{color:var(--text);font-size:14.5px;opacity:.92;margin:2px 0 10px}
.foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.badge{background:var(--badge);color:var(--badge-text);border-radius:6px;padding:2px 8px;font-weight:600}
.tag{background:var(--tagbg);border-radius:6px;padding:2px 8px}
footer{
  margin-top:32px;padding-top:18px;border-top:1px solid var(--border);
  font-size:12.5px;color:var(--muted);text-align:center
}
.empty{text-align:center;padding:40px 0;color:var(--muted)}
.sources{font-size:12.5px;color:var(--muted);margin-top:6px}
.sources .fail{color:#b91c1c}
@media (prefers-color-scheme: dark){ .sources .fail{color:#f87171} }
a.plain{color:var(--accent);text-decoration:none}
a.plain:hover{text-decoration:underline}
a{color:inherit;text-decoration:none}
.tip{
  background:var(--card);border:1px dashed var(--border);border-radius:10px;
  padding:10px 14px;font-size:12.5px;color:var(--muted);margin-bottom:14px
}
.purl{
  margin-top:8px;font-size:11.5px;color:var(--muted);word-break:break-all;
  background:var(--tagbg);border-radius:6px;padding:6px 8px;user-select:all;
  -webkit-user-select:all;line-height:1.5
}
.idx{display:flex;flex-direction:column;gap:8px}
.idx-item{
  background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 16px;
  display:flex;justify-content:space-between;gap:12px;align-items:center
}
.idx-item:hover{border-color:var(--accent)}
.idx-date{font-weight:600}
.idx-count{font-size:12.5px;color:var(--muted)}
@media (max-width:480px){
  h1{font-size:21px} header{padding:26px 0 22px}
  .card{padding:14px} .title{font-size:15.5px}
}
</style>
</head>
